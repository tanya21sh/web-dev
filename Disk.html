<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MW</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="background-image" aria-hidden="true"></div>
    <main class="page-shell">
      <p class="eyebrow">MW</p>
      <h1>A simple place to start.</h1>
      <p class="intro">This is a cleanest starter page for MW. Edit the text, colors, and layout to make it yours.</p>
      <button id="welcomeButton" type="button">Say hello</button>
      <p id="message" class="message" aria-live="polite"></p>
      <section class="scroll-space" aria-label="MW details">
        <p>Keep scrolling. The background moves gently with the page.</p>
      </section>
    </main>
    <script src="script.js"></script>
  </body>
</html>
